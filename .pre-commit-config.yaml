repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key        # ชั้นที่สองของการกัน secret: สแกนเนื้อหาไฟล์ ไม่สนชื่อไฟล์
      - id: check-added-large-files   # กัน Parquet/DuckDB หลุดเข้า git
        args: ["--maxkb=500"]
      - id: check-yaml                # config/*.yaml, docker-compose, dbt
      - id: check-toml                # pyproject.toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
