# closed (ไม่บังคับ): วันที่ร้านปิด = ไม่มีบิลเลยทุกช่องทาง ชนะ multiplier ทุกตัว)
#   weekdays: [mon..sun] · dates: รูปแบบเดียวกับ date_range (type annual | dated | public_holiday) ไม่มี multiplier
branches:
  - branch_id: CNX01
    branch_name: Kinda Nimman
    city_id: CNX
    franchisee_id: HQ
    channels: [walk_in, grab, lineman, shopeefood]
  - branch_id: CNX02
    branch_name: Kinda Santitham
    city_id: CNX
    franchisee_id: F001
    channels: [walk_in, grab, lineman]
    closed:
      weekdays: [sat]
      dates:
        - {type: annual, start: "04-13", end: "04-15"}   # ปิดสงกรานต์ทุกปี
  - branch_id: BKK01
    branch_name: Kinda Ari
    city_id: BKK
    franchisee_id: F002
    channels: [walk_in, grab, lineman, shopeefood]
  - branch_id: BKK02
    branch_name: Kinda Thonglor
    city_id: BKK
    franchisee_id: F002     # เจ้าเดียวกับ BKK01
    channels: [walk_in, grab, lineman, shopeefood]
  - branch_id: CPN01
    branch_name: Kinda Chumphon
    city_id: CPN
    franchisee_id: F003
    channels: [walk_in, grab]
    closed:
      weekdays: [mon]
      dates:
        - {type: annual, start: "04-13", end: "04-15"}   # ปิดสงกรานต์ทุกปี

# settlement.type: days_after (days: N วันหลังขาย) | weekly (weekday: mon..sun)
channels:
  - channel_id: walk_in
    channel_name: Walk-in
    gp_rate: 0.00
    settlement: {type: days_after, days: 0}   # ได้เงินทันที
  - channel_id: grab
    channel_name: GrabFood
    gp_rate: 0.30
    settlement: {type: days_after, days: 1}
  - channel_id: lineman
    channel_name: LINE MAN
    gp_rate: 0.30
    settlement: {type: days_after, days: 1}
  - channel_id: shopeefood
    channel_name: ShopeeFood
    gp_rate: 0.30
    settlement: {type: days_after, days: 1}

