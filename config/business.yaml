    royalty_rate: 0.00
  - franchisee_id: F001
    franchisee_name: Lanna Sweet Co., Ltd.
    royalty_rate: 0.05
  - franchisee_id: F002
    franchisee_name: Bangkok Cream Co., Ltd.
    royalty_rate: 0.05
  - franchisee_id: F003
    franchisee_name: Chumphon Bakery Partnership
    royalty_rate: 0.04

cities:
  - {city_id: CNX, city_name: Chiang Mai, region: north}
  - {city_id: BKK, city_name: Bangkok,    region: central}
