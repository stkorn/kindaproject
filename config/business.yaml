# seasonality:  ตัวคูณ (multiplier) ตามมิติที่เลือก
seasonality:
  day_of_week: {mon: 1.00, tue: 1.00, wed: 1.00, thu: 1.00, fri: 1.00, sat: 1.20, sun: 1.20}
  # บิลทั้งวัน = base × day_of_week × ทุก date_range ที่วันนั้นตรง (คูณกันทั้งหมด)
  # type:  public_holiday → วันหยุดราชการไทยจาก library holidays (คำนวณทุกปีให้เอง รวมวันชดเชย)
  #        annual         → วันที่ตายตัวทุกปี start/end เป็น "MM-DD"
  #        dated          → ปฏิทินธุรกิจ start/end เป็น "YYYY-MM-DD" ต้องเพิ่มของปีใหม่ทุกปี
  # วันที่ใส่ "" เสมอ · รวมวัน start และ end · multiplier เป็นค่าประมาณ
  # cities (ไม่บังคับ): ใช้เฉพาะสาขาในเมืองเหล่านี้ · ไม่ใส่ = ทุกสาขา
  date_range:
    - {type: public_holiday, range_name: public_holiday,                                           multiplier: 1.20}
    - {type: annual,         range_name: valentine,        start: "02-14",      end: "02-14",      multiplier: 1.30}
    - {type: annual,         range_name: term_break,       start: "04-01",      end: "05-31",      multiplier: 0.80}
    # สงกรานต์ซ้อนกับ public_holiday ×1.20 และ term_break ×0.80 → ผลรวม BKK 0.384, CNX 1.152 (ก่อน day_of_week)
    - {type: annual,         range_name: songkran_bkk,     start: "04-13",      end: "04-15",      multiplier: 0.40, cities: [BKK]}
    - {type: annual,         range_name: songkran_cnx,     start: "04-13",      end: "04-15",      multiplier: 1.20, cities: [CNX]}
    - {type: dated,          range_name: chinese_new_year, start: "2026-02-17", end: "2026-02-17", multiplier: 1.10}
  hourly_weight:
    10: 1.0
    11: 1.0
    12: 1.0
    13: 1.0
    14: 1.0
    15: 1.0
    16: 1.0
    17: 1.0
    18: 1.2
    19: 1.2
    20: 1.2
    21: 1.2
    22: 1.2
